<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário MLC - Movimento Luta de Classes DF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="logo-png-vermelha.png" alt="Logo MLC">
            </div>
            <div class="header-text">
                <h1>Calendário MLC</h1>
                <p>Movimento Luta de Classes DF</p>
            </div>
        </div>
    </header>

    <main>
        <div class="calendars-container">
            <div class="calendar-card">
                <div class="calendar-header" style="background-color: #A01E47; border-left-color: #C65B56;">
                    Brigadas Fixas
                </div>
                <div class="calendar-content">
                    <iframe 
                        src="https://calendar.google.com/calendar/embed?src=892c75608373b5dad6199a07949f0fa8e09f8b4041885220f081ce03de9d050c%40group.calendar.google.com&ctz=America%2FSao_Paulo&color=%23F6BF26"
                        frameborder="0" scrolling="no"></iframe>
                </div>
            </div>

            <div class="calendar-card">
                <div class="calendar-header" style="background-color: #A01E47; border-left-color: #C65B56;">
                    Atividades Temáticas
                </div>
                <div class="calendar-content">
                    <iframe 
                        src="https://calendar.google.com/calendar/embed?src=bd2d794a96abb5b4708c08e2efad8136c5663b9ba346e7d4597a7e48fc506435%40group.calendar.google.com&ctz=America%2FSao_Paulo&color=%23E67C73"
                        frameborder="0" scrolling="no"></iframe>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Movimento Luta de Classes DF</p>
        <p>Calendário de Brigadas Temáticas e Atividades Fixas</p>
    </footer>
</body>
</html>
