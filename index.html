<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calendário do Movimento Luta de Classes DF - Brigadas Temáticas e Atividades Fixas">
    <meta name="keywords" content="MLC, Movimento Luta de Classes, DF, calendário, brigadas, atividades">
    <meta name="author" content="Movimento Luta de Classes DF">
    <title>Calendário MLC - Movimento Luta de Classes DF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="logo-png-vermelha.png" alt="Logo do Movimento Luta de Classes DF">
            </div>
            <div class="header-text">
                <h1>Calendário MLC</h1>
                <p>Movimento Luta de Classes DF</p>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="calendars-container">
            <!-- CALENDAR CARD -->
            <div class="calendar-card">
                <!-- HEADER -->
                <div class="calendar-header">
                    Brigadas Temáticas e Atividades Fixas
                </div>

                <!-- CONTROLS -->
                <div class="calendar-controls">
                    <button 
                        data-mode="DAY" 
                        onclick="changeView('DAY')" 
                        title="Visualizar calendário por dia (Tecla: D)"
                        aria-label="Visualizar calendário por dia">
                        Mês
                    </button>
                    <button 
                        data-mode="WEEK" 
                        onclick="changeView('WEEK')" 
                        title="Visualizar calendário por semana (Tecla: S)"
                        aria-label="Visualizar calendário por semana">
                        Semana
                    </button>
                    <button 
                        data-mode="AGENDA" 
                        onclick="changeView('AGENDA')" 
                        title="Visualizar calendário em modo agenda (Tecla: A)"
                        aria-label="Visualizar calendário em modo agenda">
                        Cronograma
                    </button>
                </div>

                <!-- CALENDAR CONTENT -->
                <div class="calendar-content">
                    <iframe
                        id="calendarFrame"
                        src="https://calendar.google.com/calendar/embed?height=600&wkst=1&bgcolor=%23ffffff&ctz=America%2FSao_Paulo&src=892c75608373b5dad6199a07949f0fa8e09f8b4041885220f081ce03de9d050c%40group.calendar.google.com&color=%23F6BF26&src=bd2d794a96abb5b4708c08e2efad8136c5663b9ba346e7d4597a7e48fc506435%40group.calendar.google.com&color=%23E67C73&src=167c0e7f60a4ecdfbf2dcba6d71dab6c3541fec1af014bd7515a6757861b5533%40group.calendar.google.com&color=%234285F4&mode=AGENDA&showTitle=0&showTabs=0&showCalendars=0&showPrint=0&showTz=0"
                        title="Calendário do MLC com Brigadas e Atividades do MLC - DF"
                        frameborder="0"
                        scrolling="no"
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2025 Movimento Luta de Classes DF</p>
        <p>Calendário de Brigadas Temáticas e Atividades Fixas</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="script.js"></script>
</body>
</html>
